name: Publish GHCR

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/jmanzanog/market-data-service

jobs:
  publish:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (same commit that CI validated)
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Set up git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute or reuse release version
        id: version
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          YEAR_MONTH="$(date -u +'%Y.%m')"
          existing_for_commit="$(git tag --points-at "$HEAD_SHA" | grep -E "^${YEAR_MONTH}\.[0-9]+$" | sort -V | tail -n1 || true)"
          if [ -n "$existing_for_commit" ]; then
            VERSION="$existing_for_commit"
          else
            latest_for_month="$(git tag -l "${YEAR_MONTH}.*" | sort -V | tail -n1 || true)"
            if [ -z "$latest_for_month" ]; then
              PATCH=1
            else
              PATCH="${latest_for_month##*.}"
              PATCH=$((PATCH + 1))
            fi
            VERSION="${YEAR_MONTH}.${PATCH}"
            git tag -a "$VERSION" "$HEAD_SHA" -m "Release $VERSION"
            git push origin "$VERSION"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Ensure GitHub release exists
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists"
          else
            gh release create "$VERSION" --target "$HEAD_SHA" --title "$VERSION" --notes "Automated release for $VERSION"
          fi

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
